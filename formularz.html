<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz kontaktowy</title>
</head>
<body>

<form action="skrypt.php" method="post">

    <fieldset>
        <legend>Dane osobowe</legend>

        <label for="imie">Imię i nazwisko</label>
        <input
            type="text"
            id="imie"
            name="imie"
            required
            minlength="2"
            maxlength="100"
        >

        <br><br>

        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
        >

        <br><br>

        <label for="telefon">Telefon</label>
        <input
            type="tel"
            id="telefon"
            name="telefon"
            pattern="[+][0-9]{2} [0-9]{3}-[0-9]{3}-[0-9]{3}"
            placeholder="+48 123-456-789"
            title="Format: +48 123-456-789"
        >

    </fieldset>

    <br>

    <fieldset>
        <legend>Płeć</legend>

        <input
            type="radio"
            id="mezczyzna"
            name="plec"
            value="M"
        >
        <label for="mezczyzna">Mężczyzna</label>

        <input
            type="radio"
            id="kobieta"
            name="plec"
            value="K"
        >
        <label for="kobieta">Kobieta</label>

    </fieldset>

    <br>

    <fieldset>
        <legend>Wiadomość</legend>

        <label for="temat">Temat wiadomości</label>
        <select id="temat" name="temat" required>
            <option value="" disabled selected>Wybierz temat</option>
            <option value="pytanie">Pytanie</option>
            <option value="reklamacja">Reklamacja</option>
            <option value="wspolpraca">Współpraca</option>
            <option value="inne">Inne</option>
        </select>

        <br><br>

        <label for="wiadomosc">Treść wiadomości</label>
        <textarea
            id="wiadomosc"
            name="wiadomosc"
            rows="6"
            cols="40"
            minlength="10"
            required
        ></textarea>

    </fieldset>

    <br>

    <fieldset>
        <legend>Zgody</legend>

        <input
            type="checkbox"
            id="zgodaRegulamin"
            name="ZgodaRegulamin"
            value="tak"
            required
        >
        <label for="zgodaRegulamin">
            Akceptuję regulamin
        </label>

        <br>

        <input
            type="checkbox"
            id="zgodaReklamowa"
            name="ZgodaReklamowa"
            value="tak"
        >
        <label for="zgodaReklamowa">
            Wyrażam zgodę na reklamy
        </label>

    </fieldset>

    <br>

    <button type="submit">Wyślij</button>

</form>

</body>
</html>
